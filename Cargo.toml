[workspace]
resolver = "2"
members = [
    "salim",
    "salim-frame",
    "salim-array",
    "salim-stats",
    "salim-plot",
    "salim-ml",
    "salim-io",
    "salim-notebook",
    "salim-errors",
    "salim-cli",
    "salim-py2rs",
    "salim-bench",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
authors = ["Salim Data Kit Authors"]
license = "MIT OR Apache-2.0"
homepage = "https://github.com/salim-rs/salim"
repository = "https://github.com/salim-rs/salim"
keywords = ["dataframe", "data-science", "polars", "pandas", "machine-learning"]
categories = ["science", "data-structures", "development-tools"]

[workspace.dependencies]
polars = { version = "0.38", features = ["lazy", "sql", "parquet", "json", "csv", "ndarray", "strings", "temporal", "rolling_window"] }
ndarray = { version = "0.15", features = ["rayon", "serde"] }
linfa = "0.7"
linfa-linear = "0.7"
linfa-trees = "0.7"
linfa-clustering = "0.7"
plotters = "0.3"
statrs = "0.16"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
rayon = "1.10"
clap = { version = "4.5", features = ["derive"] }
arrow = "51.0"
comfy-table = "7.1"
colored = "2.1"
strsim = "0.11"
